name: Pilot Janitor - Nettoyage automatique
on:
  schedule:
    - cron: '0 0 * * *' # Se lance tous les jours à minuit
  workflow_dispatch:      # Permet de le lancer manuellement pour tester

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère tout l'historique pour connaître l'âge des fichiers

      - name: Suppression des vieux projets (> 30 jours)
        run: |
          # Date limite : il y a 30 jours en secondes
          THRESHOLD=$(date -d "30 days ago" +%s)
          
          # On boucle sur tous les fichiers .html du dossier racine
          for file in *.html; do
            # On ignore les fichiers essentiels (ex: index.html ou Export_Pilot.html)
            if [ "$file" == "index.html" ] || [ "$file" == "Export_Pilot.html" ]; then
              continue
            fi
            
            # On récupère la date du dernier commit (modification) du fichier
            LAST_COMMIT_TS=$(git log -1 --format="%at" -- "$file")
            
            if [ "$LAST_COMMIT_TS" -lt "$THRESHOLD" ]; then
              echo "Suppression du projet obsolète : $file"
              rm "$file"
            fi
          done

          # On enregistre les changements sur GitHub
          git config user.name "Pilot Janitor"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Nettoyage : Suppression des projets de plus de 30 jours" && git push)
